<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - Ferremas</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1><i class="fas fa-tools"></i> Ferremas</h1>
        <p>Inicia sesión en tu cuenta</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn-primary">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
      </form>

      <!-- Botones de desarrollo para facilitar testing -->
      <div class="dev-buttons" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #eee;">
        <h4 style="margin-bottom: 1rem; color: #666;">Acceso Rápido (Solo Desarrollo)</h4>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <button onclick="simulateClientLogin()" class="btn-secondary" style="flex: 1; min-width: 150px;">
            <i class="fas fa-user"></i> Cliente Demo
          </button>
          <button onclick="simulateAdminLogin()" class="btn-secondary" style="flex: 1; min-width: 150px;">
            <i class="fas fa-cog"></i> Admin Demo
          </button>
        </div>
        <p style="font-size: 0.8rem; color: #999; margin-top: 0.5rem; text-align: center;">
          ⚠️ Solo para desarrollo - Usa credenciales reales en producción
        </p>
      </div>

      <div class="auth-footer">
        <p>¿No tienes una cuenta? <a href="/register">Regístrate aquí</a></p>
        <p><a href="/"><i class="fas fa-home"></i> Volver al inicio</a></p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Manejar el formulario de login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      handleLogin(email, password);
    });
  </script>
</body>
</html>
